<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kotiin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Junat kotiin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: freshness line on top, one hero card led by the track sign and the minutes left, a short list of later trains, then the walking-time setting. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --ink: #0e1a26;
  --muted: #56667a;
  --line: #d9e0e8;
  --accent: #0a66b2;
  --sign-bg: #0b2a45;
  --sign-fg: #ffffff;
  --ok: #17814a;
  --late: #a65f00;
  --bad: #b82a2a;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1218;
    --surface: #131c25;
    --ink: #e8eef4;
    --muted: #92a2b3;
    --line: #26323f;
    --accent: #5aa9ec;
    --sign-bg: #1c5185;
    --sign-fg: #ffffff;
    --ok: #4cc283;
    --late: #f0b050;
    --bad: #ff7b7b;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 12px; }
header h1 { margin: 0; min-width: 0; font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
header h1 .arrow { color: var(--accent); padding: 0 .15em; }
button {
  font: inherit; font-weight: 500; font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 14px; min-height: 40px; cursor: pointer; flex: none;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button[disabled] { opacity: .6; cursor: default; }

#status { margin: -4px 0 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
#status.stale .dot, #status.error .dot { background: var(--bad); }
#status .warn { color: var(--bad); font-weight: 600; }

.dim { opacity: .45; transition: opacity .2s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px 18px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
.hero-top .warn { color: var(--late); }
.hero-main { display: flex; align-items: center; gap: 16px; margin-top: 10px; }

.sign { flex: none; width: 124px; background: var(--sign-bg); color: var(--sign-fg); border-radius: 14px; padding: 9px 6px 12px; text-align: center; }
.sign .lbl { display: block; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; opacity: .85; }
.sign .val { display: block; font-family: var(--font-num); font-weight: 700; font-size: 92px; line-height: .95; font-variant-numeric: tabular-nums; }
.sign.unknown .val { opacity: .5; }

.hero-right { flex: 1 1 0; min-width: 0; }
.count { font-family: var(--font-num); font-weight: 700; font-size: 56px; line-height: .95; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.count.long { font-size: 34px; }
.clock { margin-top: 6px; color: var(--muted); font-size: 20px; font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.clock b { color: var(--ink); font-weight: 700; }
.clock s { margin-right: 6px; }

.hero-bottom { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .dest { font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  flex: none; display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px;
  background: var(--accent); color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 22px; line-height: 1;
}
@media (prefers-color-scheme: dark) { .badge { color: #06131f; } }
.arrive { color: var(--muted); font-size: 16px; }
.arrive b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.note { margin: 12px 0 0; color: var(--muted); font-size: 14px; }

.chip { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; text-transform: none; letter-spacing: 0; }
.chip.late { color: var(--late); }
.chip.bad { color: var(--bad); }

.list-title { margin: 8px 2px 0; font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid; grid-template-columns: 32px minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
}
.row .when { min-width: 0; }
.row .top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.row .t { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; flex: none; }
.row .late { color: var(--late); font-size: 14px; font-weight: 700; font-family: var(--font-num); white-space: nowrap; }
.row .dest { color: var(--muted); font-size: 14px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mid { text-align: right; white-space: nowrap; }
.row .in { font-family: var(--font-num); font-weight: 600; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--muted); }
.row .arr { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .bad { color: var(--bad); font-weight: 600; font-size: 16px; }
.row .track {
  min-width: 46px; height: 46px; display: grid; place-items: center; border-radius: 9px;
  background: var(--sign-bg); color: var(--sign-fg); font-family: var(--font-num); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums;
}
.row .track.unknown { opacity: .45; }
.row.cancelled .t { text-decoration: line-through; color: var(--muted); }
.row.cancelled .track { opacity: .35; }
.row.missed { opacity: .5; }
.row.missed .in { font-size: 15px; }

.empty { text-align: center; color: var(--muted); padding: 26px 18px; }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

.walk { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; font-size: 15px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; padding: 0; font-size: 20px; line-height: 1; }
.stepper output { min-width: 58px; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }

footer { color: var(--muted); font-size: 12px; }

@media (max-width: 380px) {
  .sign { width: 108px; }
  .sign .val { font-size: 78px; }
  .count { font-size: 48px; }
  .count.long { font-size: 30px; }
  header h1 { font-size: 26px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Helsinki<span class="arrow">→</span>Huopalahti</h1>
    <button id="refresh" type="button">Päivitä</button>
  </header>

  <p id="status"></p>
  <section id="hero" aria-live="polite"></section>
  <section id="list"></section>

  <div class="walk" role="group" aria-label="Kävelyaika raiteelle">
    <span>Kävelyaika raiteelle</span>
    <div class="stepper">
      <button id="walkDown" type="button" aria-label="Vähemmän">−</button>
      <output id="walkVal">3 min</output>
      <button id="walkUp" type="button" aria-label="Enemmän">+</button>
    </div>
  </div>

  <footer>Lähde: Fintraffic / Digitraffic, avoin data (CC 4.0 BY). Aikataulu- ja raidetiedot voivat muuttua viime hetkellä. Näytetään vain junat, joiden matka-aika on alle 25 minuuttia.</footer>
</main>

<script>
/*LOGIC_START*/
const FROM = 'HKI';
const TO = 'HPL';
const MAX_TRIP_MIN = 25;

// Turns the raw Digitraffic train list into the departures this page shows.
function pickTrains(trains, now) {
  const out = [];
  for (const t of trains || []) {
    if (t.trainCategory && t.trainCategory !== 'Commuter') continue;
    const rows = t.timeTableRows || [];
    const dep = rows.find(r => r.stationShortCode === FROM && r.type === 'DEPARTURE');
    if (!dep) continue;
    const arr = rows.slice(rows.indexOf(dep) + 1)
      .find(r => r.stationShortCode === TO && r.type === 'ARRIVAL');
    if (!arr) continue;
    if (dep.commercialStop === false || arr.commercialStop === false) continue;
    if (dep.actualTime) continue; // already left

    const sched = Date.parse(dep.scheduledTime);
    // Skip trains that reach Huopalahti the long way round (e.g. the ring rail loop).
    if (Date.parse(arr.scheduledTime) - sched > MAX_TRIP_MIN * 60000) continue;
    const est = dep.liveEstimateTime ? Date.parse(dep.liveEstimateTime) : sched;
    const cancelled = Boolean(t.cancelled || dep.cancelled || arr.cancelled);
    if (est < now - 20000) continue;

    const arrSched = Date.parse(arr.scheduledTime);
    const arrEst = arr.liveEstimateTime ? Date.parse(arr.liveEstimateTime) : arrSched + (est - sched);
    out.push({
      trainNumber: t.trainNumber,
      line: t.commuterLineID || '?',
      track: (dep.commercialTrack || '').trim(),
      dest: rows.length ? rows[rows.length - 1].stationShortCode : '',
      sched, est, arrEst, cancelled,
      lateMin: Math.round((est - sched) / 60000),
    });
  }
  out.sort((a, b) => a.est - b.est);
  return out;
}

// Picks the hero train and the rows below it, taking the walking time to the platform into account.
// mode: 'next' = earliest departure you can catch, 'fastest' = a later train that arrives sooner,
// 'tight' = nothing is catchable on foot.
function choose(trains, now, walkMin) {
  const lead = walkMin * 60000;
  const all = trains.map(t => ({ ...t, missed: !t.cancelled && t.est - now < lead }));
  const ok = all.filter(t => !t.cancelled && !t.missed);
  let hero = null;
  let mode = 'next';
  if (ok.length) {
    hero = ok.reduce((best, t) => (t.arrEst < best.arrEst ? t : best), ok[0]);
    if (hero !== ok[0]) mode = 'fastest';
  } else {
    const live = all.filter(t => !t.cancelled);
    if (live.length) { hero = live[live.length - 1]; mode = 'tight'; }
  }
  const others = all.filter(t => t !== hero);
  const missed = others.filter(t => t.missed).slice(-1);
  const next = others.filter(t => !t.missed).slice(0, 4);
  return { hero, mode, rows: [...missed, ...next] };
}

function countdownText(est, now) {
  const mins = Math.floor((est - now) / 60000);
  if (mins < 1) return 'nyt';
  if (mins < 60) return mins + ' min';
  return Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min';
}

function cleanStationName(n) {
  return String(n).replace(/ asema$/i, '');
}
/*LOGIC_END*/

const BASE = 'https://rata.digitraffic.fi/api/v1/';
const API = BASE + 'live-trains/station/' + FROM +
  '?departing_trains=40&departed_trains=0&arrived_trains=0&arriving_trains=0' +
  '&include_nonstopping=false&train_categories=Commuter';
const STATIONS_API = BASE + 'metadata/stations';
const REFRESH_MS = 20000;
const STALE_MS = 60000;

const fmtTime = new Intl.DateTimeFormat('fi-FI', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Helsinki' });
const fmtSec = new Intl.DateTimeFormat('fi-FI', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Helsinki' });

const state = { raw: null, fetchedAt: 0, error: null, loading: false, walkMin: 3 };
const stationNames = {};

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* storage may be unavailable */ } }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function h(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

function destName(code) { return stationNames[code] || ''; }

function trackSign(track) {
  const s = h('div', 'sign' + (track ? '' : ' unknown'));
  s.append(h('span', 'lbl', 'Raide'), h('span', 'val', track || '–'));
  return s;
}

// Only deviations get a chip; on-time trains stay quiet.
function delayChip(tr) {
  if (tr.cancelled) return h('span', 'chip bad', 'Peruttu');
  if (tr.lateMin >= 1) return h('span', 'chip late', '+' + tr.lateMin + ' min');
  return null;
}

const HERO_LABELS = { next: 'Seuraava lähtö', fastest: 'Nopein perille', tight: 'Et ehdi kävellen' };

function renderHero(tr, mode, now) {
  const card = h('div', 'card');
  const top = h('div', 'hero-top');
  top.append(h('span', mode === 'tight' ? 'warn' : null, HERO_LABELS[mode]));
  const chip = delayChip(tr);
  if (chip) top.append(chip);

  const main = h('div', 'hero-main');
  const right = h('div', 'hero-right');
  const cd = countdownText(tr.est, now);
  right.append(h('div', 'count' + (cd.length > 7 ? ' long' : ''), cd));
  const clock = h('div', 'clock');
  clock.append('klo ');
  if (tr.lateMin >= 1) clock.append(h('s', null, fmtTime.format(tr.sched)));
  clock.append(h('b', null, fmtTime.format(tr.est)));
  right.append(clock);
  main.append(trackSign(tr.track), right);

  const bottom = h('div', 'hero-bottom');
  const who = h('div', 'who');
  who.append(h('span', 'badge', tr.line));
  const dn = destName(tr.dest);
  if (dn) who.append(h('span', 'dest', dn));
  const arrive = h('span', 'arrive');
  arrive.append('Perillä Huopalahdessa ', h('b', null, fmtTime.format(tr.arrEst)));
  bottom.append(who, arrive);

  card.append(top, main, bottom);
  if (!tr.track) card.append(h('p', 'note', 'Raidetta ei ole vielä ilmoitettu. Se ilmestyy tähän yleensä ennen lähtöä.'));
  if (mode === 'tight') card.append(h('p', 'note', 'Tähän ehtisi vain juosten. Seuraavia junia ei ole vielä tiedossa.'));
  return card;
}

function renderRow(tr, now) {
  const row = h('div', 'row' + (tr.cancelled ? ' cancelled' : '') + (tr.missed ? ' missed' : ''));
  const when = h('div', 'when');
  const top = h('div', 'top');
  top.append(h('div', 't', fmtTime.format(tr.est)));
  if (tr.lateMin >= 1 && !tr.cancelled) top.append(h('span', 'late', '+' + tr.lateMin));
  when.append(top);
  const dn = destName(tr.dest);
  if (dn) when.append(h('div', 'dest', dn));
  const mid = h('div', 'mid');
  if (tr.cancelled) mid.append(h('div', 'bad', 'Peruttu'));
  else {
    mid.append(h('div', 'in', tr.missed ? 'et ehdi' : countdownText(tr.est, now)));
    mid.append(h('div', 'arr', 'perillä ' + fmtTime.format(tr.arrEst)));
  }
  row.append(
    h('span', 'badge', tr.line),
    when,
    mid,
    h('span', 'track' + (tr.track ? '' : ' unknown'), tr.track || '–')
  );
  return row;
}

function renderEmpty(msg, detail) {
  const box = h('div', 'card empty');
  box.append(h('strong', null, msg), document.createTextNode(detail));
  return box;
}

function draw() {
  const now = Date.now();
  const hero = document.getElementById('hero');
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  document.getElementById('refresh').disabled = state.loading;
  document.getElementById('walkVal').textContent = state.walkMin + ' min';
  document.getElementById('walkDown').disabled = state.walkMin <= 0;
  document.getElementById('walkUp').disabled = state.walkMin >= 10;

  const age = state.fetchedAt ? now - state.fetchedAt : Infinity;
  const stale = state.raw !== null && age > STALE_MS;
  hero.className = stale ? 'dim' : '';
  list.className = stale ? 'dim' : '';

  hero.replaceChildren();
  list.replaceChildren();

  if (state.raw === null) {
    hero.append(renderEmpty(state.error ? 'Junatietoja ei saatu' : 'Haetaan junia…',
      state.error ? 'Yritän uudelleen automaattisesti.' : ''));
  } else {
    const picked = choose(pickTrains(state.raw, now), now, state.walkMin);
    if (!picked.hero) {
      hero.append(renderEmpty('Ei lähtöjä Huopalahteen', 'Seuraavan noin 40 lähdön joukossa ei ole Huopalahden kautta kulkevaa junaa.'));
    } else {
      hero.append(renderHero(picked.hero, picked.mode, now));
    }
    if (picked.rows.length) {
      list.append(h('p', 'list-title', 'Sen jälkeen'));
      const rows = h('div', 'rows');
      for (const tr of picked.rows) rows.append(renderRow(tr, now));
      list.append(rows);
    }
  }

  status.className = state.error || stale ? (stale ? 'stale' : 'error') : '';
  status.replaceChildren(h('span', 'dot'));
  status.append(state.fetchedAt ? 'Päivitetty ' + fmtSec.format(state.fetchedAt) : 'Ei vielä päivitetty');
  if (stale) status.append(h('span', 'warn', ' · Tieto on vanhaa, tarkista asemanäytöltä'));
  else if (state.error) status.append(h('span', 'warn', ' · ' + state.error));
}

async function load() {
  if (state.loading) return;
  state.loading = true;
  draw();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(API, { signal: ctrl.signal, cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.raw = await res.json();
    state.fetchedAt = Date.now();
    state.error = null;
  } catch (e) {
    state.error = e.name === 'AbortError' ? 'Haku kesti liian kauan' : 'Yhteys ei toiminut';
  } finally {
    clearTimeout(timer);
    state.loading = false;
    draw();
  }
}

// Station names turn terminus codes like KKN into readable destinations. Cached for a week.
async function loadStations() {
  try {
    const cached = JSON.parse(recall('stations-v1') || 'null');
    if (cached && cached.map && Date.now() - cached.t < 7 * 864e5) {
      Object.assign(stationNames, cached.map);
      draw();
      return;
    }
  } catch (e) { /* ignore a corrupt cache */ }
  try {
    const res = await fetch(STATIONS_API);
    if (!res.ok) return;
    const map = {};
    for (const s of await res.json()) {
      if (s.stationShortCode && s.stationName && s.passengerTraffic !== false) {
        map[s.stationShortCode] = cleanStationName(s.stationName);
      }
    }
    Object.assign(stationNames, map);
    store('stations-v1', JSON.stringify({ t: Date.now(), map }));
    draw();
  } catch (e) { /* destinations simply stay hidden */ }
}

function setWalk(v) {
  state.walkMin = Math.max(0, Math.min(10, v));
  store('walk-min', String(state.walkMin));
  draw();
}

const savedWalk = parseInt(recall('walk-min'), 10);
if (Number.isFinite(savedWalk)) state.walkMin = Math.max(0, Math.min(10, savedWalk));

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('walkDown').addEventListener('click', () => setWalk(state.walkMin - 1));
document.getElementById('walkUp').addEventListener('click', () => setWalk(state.walkMin + 1));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { draw(); load(); }
});
setInterval(load, REFRESH_MS);
setInterval(draw, 1000);
draw();
load();
loadStations();
</script>
</body>
</html>
