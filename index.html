<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Junat kotiin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one next-departure card with a station-style track sign, followed by a compact list of later trains. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #0e1a26;
  --muted: #56667a;
  --line: #d9e0e8;
  --accent: #0a66b2;
  --sign-bg: #0b2a45;
  --sign-fg: #ffffff;
  --ok: #17814a;
  --late: #a65f00;
  --bad: #b82a2a;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1218;
    --surface: #131c25;
    --surface-2: #1a2531;
    --ink: #e8eef4;
    --muted: #92a2b3;
    --line: #26323f;
    --accent: #5aa9ec;
    --sign-bg: #1c5185;
    --sign-fg: #ffffff;
    --ok: #4cc283;
    --late: #f0b050;
    --bad: #ff7b7b;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 2px; }
header h1 { margin: 0; font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
header h1 .arrow { color: var(--accent); padding: 0 .15em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
button {
  font: inherit; font-weight: 500; font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 14px; min-height: 40px; cursor: pointer; flex: none;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button[disabled] { opacity: .6; cursor: default; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; }
.hero-top .count { color: var(--ink); font-family: var(--font-num); font-size: 26px; letter-spacing: .01em; text-transform: none; font-variant-numeric: tabular-nums; }
.hero-main { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 10px; }
.time { font-family: var(--font-num); font-weight: 700; font-size: 84px; line-height: .95; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.time-old { display: block; color: var(--muted); font-size: 18px; font-weight: 600; text-decoration: line-through; font-family: var(--font-num); margin-bottom: 4px; }

.sign {
  flex: none; width: 108px; background: var(--sign-bg); color: var(--sign-fg);
  border-radius: 12px; padding: 8px 6px 10px; text-align: center;
}
.sign .lbl { display: block; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; opacity: .85; }
.sign .val { display: block; font-family: var(--font-num); font-weight: 700; font-size: 74px; line-height: .95; font-variant-numeric: tabular-nums; }
.sign.unknown .val { opacity: .5; }

.hero-bottom { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.badge {
  display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px;
  background: var(--accent); color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 22px; line-height: 1;
}
@media (prefers-color-scheme: dark) { .badge { color: #06131f; } }
.arrive { color: var(--muted); font-size: 15px; }
.arrive b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip { margin-left: auto; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.ok { color: var(--ok); }
.chip.late { color: var(--late); }
.chip.bad { color: var(--bad); }

.list-title { margin: 6px 2px -4px; font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid; grid-template-columns: 32px minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
}
.row .when { min-width: 0; }
.row .t { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.row .t s { color: var(--muted); font-size: 16px; font-weight: 600; margin-left: 6px; }
.row .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.row .sub .late { color: var(--late); font-weight: 600; }
.row .sub .bad { color: var(--bad); font-weight: 600; }
.row .in { font-family: var(--font-num); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.row .track {
  min-width: 46px; height: 46px; display: grid; place-items: center; border-radius: 9px;
  background: var(--sign-bg); color: var(--sign-fg); font-family: var(--font-num); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums;
}
.row .track.unknown { opacity: .45; }
.row.cancelled .t, .row.cancelled .in { text-decoration: line-through; color: var(--muted); }
.row.cancelled .track { opacity: .35; }

.empty { text-align: center; color: var(--muted); padding: 26px 18px; }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

#status { margin: 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
#status.stale .dot { background: var(--late); }
#status.error .dot { background: var(--bad); }
#status .err { color: var(--bad); font-weight: 600; }
footer { color: var(--muted); font-size: 12px; }
footer a { color: inherit; }

@media (max-width: 380px) {
  .time { font-size: 70px; }
  .sign { width: 94px; }
  .sign .val { font-size: 62px; }
  header h1 { font-size: 26px; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Helsinki<span class="arrow">→</span>Huopalahti</h1>
      <p>Lähijunat Helsingin rautatieasemalta</p>
    </div>
    <button id="refresh" type="button">Päivitä</button>
  </header>

  <section id="hero" aria-live="polite"></section>
  <section id="list"></section>
  <p id="status"></p>
  <footer>Lähde: Fintraffic / Digitraffic, avoin data (CC 4.0 BY). Aikataulu- ja raidetiedot voivat muuttua viime hetkellä.</footer>
</main>

<script>
/*LOGIC_START*/
const FROM = 'HKI';
const TO = 'HPL';

// Turns the raw Digitraffic train list into the departures this page shows.
function pickTrains(trains, now) {
  const out = [];
  for (const t of trains || []) {
    if (t.trainCategory && t.trainCategory !== 'Commuter') continue;
    const rows = t.timeTableRows || [];
    const dep = rows.find(r => r.stationShortCode === FROM && r.type === 'DEPARTURE');
    if (!dep) continue;
    const arr = rows.slice(rows.indexOf(dep) + 1)
      .find(r => r.stationShortCode === TO && r.type === 'ARRIVAL');
    if (!arr) continue;
    if (dep.commercialStop === false || arr.commercialStop === false) continue;
    if (dep.actualTime) continue; // already left

    const sched = Date.parse(dep.scheduledTime);
    const est = dep.liveEstimateTime ? Date.parse(dep.liveEstimateTime) : sched;
    const cancelled = Boolean(t.cancelled || dep.cancelled || arr.cancelled);
    if (est < now - 20000) continue;

    const arrSched = Date.parse(arr.scheduledTime);
    const arrEst = arr.liveEstimateTime ? Date.parse(arr.liveEstimateTime) : arrSched + (est - sched);
    out.push({
      trainNumber: t.trainNumber,
      line: t.commuterLineID || '?',
      track: (dep.commercialTrack || '').trim(),
      sched, est, arrEst, cancelled,
      lateMin: Math.round((est - sched) / 60000),
    });
  }
  out.sort((a, b) => a.est - b.est);
  return out;
}

function countdownText(est, now) {
  const mins = Math.floor((est - now) / 60000);
  if (mins < 1) return 'nyt';
  if (mins < 60) return mins + ' min';
  return Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min';
}
/*LOGIC_END*/

const API = 'https://rata.digitraffic.fi/api/v1/live-trains/station/' + FROM +
  '?departing_trains=40&departed_trains=0&arrived_trains=0&arriving_trains=0' +
  '&include_nonstopping=false&train_categories=Commuter';
const REFRESH_MS = 20000;

const fmtTime = new Intl.DateTimeFormat('fi-FI', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Helsinki' });
const fmtSec = new Intl.DateTimeFormat('fi-FI', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Helsinki' });

const state = { raw: null, fetchedAt: 0, error: null, loading: false };

function h(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

function trackSign(track) {
  const s = h('div', 'sign' + (track ? '' : ' unknown'));
  s.append(h('span', 'lbl', 'Raide'), h('span', 'val', track || '–'));
  return s;
}

function delayChip(tr) {
  if (tr.cancelled) return h('span', 'chip bad', 'Peruttu');
  if (tr.lateMin >= 1) return h('span', 'chip late', '+' + tr.lateMin + ' min');
  return h('span', 'chip ok', 'Aikataulussa');
}

function renderHero(tr, now) {
  const card = h('div', 'card');
  const top = h('div', 'hero-top');
  top.append(h('span', null, 'Seuraava lähtö'), h('span', 'count', countdownText(tr.est, now)));

  const main = h('div', 'hero-main');
  const time = h('div', 'time');
  if (tr.lateMin >= 1) time.append(h('span', 'time-old', fmtTime.format(tr.sched)));
  time.append(document.createTextNode(fmtTime.format(tr.est)));
  main.append(time, trackSign(tr.track));

  const bottom = h('div', 'hero-bottom');
  const arrive = h('span', 'arrive');
  arrive.append('Huopalahdessa ', h('b', null, fmtTime.format(tr.arrEst)));
  bottom.append(h('span', 'badge', tr.line), arrive, delayChip(tr));

  card.append(top, main, bottom);
  if (!tr.track) {
    const note = h('p', 'arrive', 'Raidetta ei ole vielä ilmoitettu. Se ilmestyy tähän yleensä ennen lähtöä.');
    note.style.margin = '12px 0 0';
    card.append(note);
  }
  return card;
}

function renderRow(tr, now) {
  const row = h('div', 'row' + (tr.cancelled ? ' cancelled' : ''));
  const when = h('div', 'when');
  const t = h('div', 't', fmtTime.format(tr.est));
  if (tr.lateMin >= 1 && !tr.cancelled) t.append(h('s', null, fmtTime.format(tr.sched)));
  const sub = h('div', 'sub');
  if (tr.cancelled) sub.append(h('span', 'bad', 'Peruttu'));
  else if (tr.lateMin >= 1) sub.append(h('span', 'late', '+' + tr.lateMin + ' min'), ' · perillä ' + fmtTime.format(tr.arrEst));
  else sub.append('Perillä ' + fmtTime.format(tr.arrEst));
  when.append(t, sub);
  row.append(
    h('span', 'badge', tr.line),
    when,
    h('span', 'in', tr.cancelled ? '' : countdownText(tr.est, now)),
    h('span', 'track' + (tr.track ? '' : ' unknown'), tr.track || '–')
  );
  return row;
}

function renderEmpty(msg, detail) {
  const box = h('div', 'card empty');
  box.append(h('strong', null, msg), document.createTextNode(detail));
  return box;
}

function draw() {
  const now = Date.now();
  const hero = document.getElementById('hero');
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const btn = document.getElementById('refresh');
  btn.disabled = state.loading;

  hero.replaceChildren();
  list.replaceChildren();

  if (state.raw === null) {
    hero.append(renderEmpty(state.error ? 'Junatietoja ei saatu' : 'Haetaan junia…',
      state.error ? 'Yritän uudelleen automaattisesti.' : ''));
  } else {
    const trains = pickTrains(state.raw, now);
    const first = trains.find(x => !x.cancelled);
    if (!first) {
      hero.append(renderEmpty('Ei lähtöjä Huopalahteen', 'Seuraavan noin 40 lähdön joukossa ei ole Huopalahden kautta kulkevaa junaa.'));
    } else {
      hero.append(renderHero(first, now));
    }
    const rest = trains.filter(x => x !== first).slice(0, 6);
    if (rest.length) {
      list.append(h('p', 'list-title', 'Sen jälkeen'));
      const rows = h('div', 'rows');
      for (const tr of rest) rows.append(renderRow(tr, now));
      list.append(rows);
    }
  }

  const age = state.fetchedAt ? now - state.fetchedAt : Infinity;
  status.className = state.error ? 'error' : (age > REFRESH_MS * 2.5 ? 'stale' : '');
  status.replaceChildren(h('span', 'dot'));
  if (state.fetchedAt) status.append('Päivitetty ' + fmtSec.format(state.fetchedAt));
  else status.append('Ei vielä päivitetty');
  if (state.error) status.append(h('span', 'err', ' · ' + state.error + ', näytetään viimeisin tieto'));
}

async function load() {
  if (state.loading) return;
  state.loading = true;
  draw();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(API, { signal: ctrl.signal, cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.raw = await res.json();
    state.fetchedAt = Date.now();
    state.error = null;
  } catch (e) {
    state.error = e.name === 'AbortError' ? 'Haku kesti liian kauan' : 'Yhteys ei toiminut';
  } finally {
    clearTimeout(timer);
    state.loading = false;
    draw();
  }
}

document.getElementById('refresh').addEventListener('click', load);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { draw(); load(); }
});
setInterval(load, REFRESH_MS);
setInterval(draw, 1000);
draw();
load();
</script>
</body>
</html>
